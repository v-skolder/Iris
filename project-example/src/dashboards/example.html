<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Example dashboard</title>
    <style>
      body { font: 16px system-ui, sans-serif; margin: 2rem auto; max-width: 900px; padding: 0 1rem; }
      button, select { margin: .25rem; padding: .5rem; }
      pre { background: #f4f4f4; overflow: auto; padding: 1rem; }
      #status { min-height: 1.5rem; }
    </style>
  </head>
  <body>
    <h1>Example dashboard</h1>
    <p>Escolha uma partição mensal para consultar ou remover do cache.</p>
    <select id="partition" aria-label="Partição"></select>
    <button id="load">Carregar partição</button>
    <button id="refresh">Atualizar partição</button>
    <button id="delete">Remover do cache</button>
    <button id="publish">Publicar dashboard</button>
    <p id="status" role="status"></p>
    <pre id="output">Aguardando dados…</pre>

    <script>
      const dashboard = IrisRuntimeSDK.example_dashboard;
      const cube = dashboard.example_cube;
      const partitionSelect = document.querySelector("#partition");
      const output = document.querySelector("#output");
      const status = document.querySelector("#status");

      for (const id of ["refresh", "delete", "publish"]) {
        document.getElementById(id).hidden = !IrisRuntimeSDK.isDesktop;
      }

      async function run(action) {
        status.textContent = "Carregando…";
        try {
          const result = await action();
          output.textContent = JSON.stringify(result ?? null, null, 2);
          status.textContent = "Concluído.";
          return result;
        } catch (error) {
          status.textContent = `Erro: ${error.message ?? error}`;
        }
      }

      async function loadPartitions() {
        // Expected shape: { partitions: [[["202609"], true], ...] }
        const result = await cube.list_partitions();
        partitionSelect.replaceChildren(new Option("Todas", ""));
        for (const [values, cached] of result.partitions) {
          const value = values.join("/");
          partitionSelect.add(new Option(`${value}${cached ? " (cache)" : ""}`, value));
        }
        output.textContent = JSON.stringify(result, null, 2);
      }

      function selectedPartitions() {
        const value = partitionSelect.value;
        return value ? [value.split("/")] : null;
      }

      document.querySelector("#load").onclick = () =>
        run(() => cube.get_data({ partitions: selectedPartitions() }));
      document.querySelector("#refresh").onclick = () =>
        run(() => cube.get_data({ partitions: selectedPartitions(), force_refresh: true }));
      document.querySelector("#delete").onclick = () =>
        run(() => cube.delete_data({ partitions: selectedPartitions() }));
      document.querySelector("#publish").onclick = () =>
        run(() => dashboard.publish({ partitions: selectedPartitions() }));

      loadPartitions().catch(error => {
        status.textContent = `Erro ao listar partições: ${error.message ?? error}`;
      });
    </script>
  </body>
</html>
